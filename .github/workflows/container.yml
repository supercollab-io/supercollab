name: relay-container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: supercollab-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Build and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: docker build --tag supercollab-relay:scan --file server/Dockerfile .
      - run: docker build --tag supercollab-postgres:scan --file deploy/postgres.Dockerfile .
      - run: ./scripts/ci/scan-container.sh supercollab-relay:scan supercollab-postgres:scan

  publish:
    name: Publish immutable image
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/supercollab-relay
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/supercollab-relay
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
