name: relay-container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: supercollab-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Build and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_TYPE}" = "tag"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: docker build --tag supercollab-relay:scan --file server/Dockerfile .
      - run: docker build --tag supercollab-postgres:scan --file deploy/postgres.Dockerfile .
      - run: ./scripts/ci/scan-container.sh supercollab-relay:scan supercollab-postgres:scan

  publish:
    name: Publish immutable image
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/supercollab-relay
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/supercollab-relay
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
